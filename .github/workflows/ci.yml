name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install test and type-check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Type-check the rule loader and regex compile worker
        run: python -m mypy --cache-dir "$RUNNER_TEMP/guiderails-mypy"
      - name: Run unit and integration tests
        shell: bash
        run: |
          for category in unit integration; do
            scratch=$(mktemp -d "$RUNNER_TEMP/guiderails-$category.XXXXXX")
            TMPDIR="$scratch" TMP="$scratch" TEMP="$scratch" \
              python tests/run.py --category "$category"
          done
