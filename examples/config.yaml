schema_version: 1
# strict는 세션·규칙별 한도 안에서 위반 호출을 거절한다.
mode: strict
effect_policy: pattern
max_rejections: 3
logging:
  # 감사 기록에 본문 발췌를 보관하지 않는다.
  excerpts: false

